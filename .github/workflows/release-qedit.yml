name: Release Qedit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.2"
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate manifests, formatting, and build scripts
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-qedit.yml")'
          bash -n scripts/build-macos-arm64.sh scripts/build-macos-x86_64.sh scripts/build-linux-amd64.sh scripts/build-linux-arm64.sh scripts/verify-release.sh
          git diff --check HEAD^ HEAD
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo check --locked --package browser

  macos:
    name: macOS
    needs: validate ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.target }}
      - name: Apply Intel GPUI compatibility patch
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          renderer=$(find "$cargo_home/git/checkouts" -path '*/crates/gpui_metal/src/renderer.rs' -print -quit)
          test -n "$renderer"
          perl -0pi -e 's/const YES: objc::runtime::BOOL = true;/const YES: objc::runtime::BOOL = true as objc::runtime::BOOL;/; s/const NO: objc::runtime::BOOL = false;/const NO: objc::runtime::BOOL = false as objc::runtime::BOOL;/' "$renderer"
          grep -F 'true as objc::runtime::BOOL' "$renderer"
      - name: Build Qedit
        run: |
          cargo build --release --features mimalloc --package zed --package cli --target ${{ matrix.target }}
          cargo build --release --package browser --bin qedit_helper --target ${{ matrix.target }}
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          root="target/${{ matrix.target }}/release"
          app="$root/Qedit.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp "$root/zed" "$app/Contents/MacOS/Qedit"
          cp crates/zed/resources/Qedit.icns "$app/Contents/Resources/Qedit.icns"
          framework=$(find "$root/build" -path "*/cef_macos_${{ matrix.arch }}/Chromium Embedded Framework.framework" -type d -print -quit)
          test -n "$framework"
          ditto "$framework" "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          helpers=("Helper" "Helper (GPU)" "Helper (Renderer)" "Helper (Plugin)" "Helper (Alerts)")
          for helper_suffix in "${helpers[@]}"; do
            helper_name="Qedit $helper_suffix"
            helper_app="$app/Contents/Frameworks/$helper_name.app"
            if [[ "$helper_suffix" == "Helper" ]]; then
              helper_identifier="dev.qedit.Qedit.helper"
            else
              helper_type="${helper_suffix#Helper (}"
              helper_type="${helper_type%)}"
              helper_identifier="dev.qedit.Qedit.helper.$helper_type"
            fi
            mkdir -p "$helper_app/Contents/MacOS"
            cp "$root/qedit_helper" "$helper_app/Contents/MacOS/$helper_name"
            cat > "$helper_app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>$helper_name</string>
          <key>CFBundleDisplayName</key><string>$helper_name</string>
          <key>CFBundleExecutable</key><string>$helper_name</string>
          <key>CFBundleIdentifier</key><string>$helper_identifier</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
            printf 'APPL????' > "$helper_app/Contents/PkgInfo"
          done
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Qedit</string>
          <key>CFBundleDisplayName</key><string>Qedit</string>
          <key>CFBundleExecutable</key><string>Qedit</string>
          <key>CFBundleIdentifier</key><string>dev.qedit.Qedit</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>Qedit.icns</string>
          <key>CFBundleShortVersionString</key><string>${RELEASE_VERSION#v}</string>
          <key>CFBundleVersion</key><string>${RELEASE_VERSION#v}</string>
          <key>LSMinimumSystemVersion</key><string>10.15.7</string>
          <key>CFBundleURLTypes</key><array><dict><key>CFBundleURLSchemes</key><array><string>qedit</string></array></dict></array>
          </dict></plist>
          PLIST
          codesign --force --sign - "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          for helper_suffix in "${helpers[@]}"; do
            codesign --force --sign - "$app/Contents/Frameworks/Qedit $helper_suffix.app"
          done
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Qedit-${RELEASE_VERSION#v}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Qedit-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}
          path: Qedit-*-macos-${{ matrix.arch }}.zip

  linux:
    name: Linux
    needs: validate ${{ matrix.arch }} DEB
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld dpkg-dev pkg-config libglib2.0-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libatk1.0-dev libcairo2-dev libx11-dev libwayland-dev libxkbcommon-dev libudev-dev libfontconfig1-dev libasound2-dev libdbus-1-dev libxkbcommon-x11-dev libegl1-mesa-dev libx11-xcb-dev
      - name: Verify native linker dependencies
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --exists x11 x11-xcb xcb
          library=$(ldconfig -p | awk '/libX11-xcb\.so/{print $NF; exit}')
          test -n "$library" && test -e "$library"
      - name: Build Qedit
        run: cargo build --locked --release --features mimalloc --package zed --package cli
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          package="qedit_${version}_${{ matrix.arch }}"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/share/applications" "$package/usr/share/doc/qedit" "$package/usr/share/icons/hicolor/512x512/apps"
          install -m 0755 target/release/zed "$package/usr/bin/qedit"
          install -m 0755 target/release/cli "$package/usr/bin/qedit-cli"
          cat > "$package/DEBIAN/control" <<CONTROL
          Package: qedit
          Version: $version
          Section: editors
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Qedit contributors
          Description: Qedit browser, code editor, and terminal
           Qedit is a fast development environment for focused work.
          CONTROL
          cat > "$package/usr/share/applications/qedit.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Qedit
          Comment=Browser, code editor, and terminal
          Exec=qedit %U
          Terminal=false
          Type=Application
          Categories=Development;TextEditor;
          Icon=qedit
          MimeType=text/plain;inode/directory;
          DESKTOP
          cp LICENSE-GPL "$package/usr/share/doc/qedit/copyright"
          install -m 0644 icon.png "$package/usr/share/icons/hicolor/512x512/apps/qedit.png"
          dpkg-deb --build --root-owner-group "$package" "Qedit-${version}-linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: Qedit-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}
          path: Qedit-*.deb

  windows:
    name: Windows
    needs: validate x64
    runs-on: windows-2022
    env:
      CARGO_HOME: 'D:\cargo'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Locate DirectX shader compiler
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $sdkBin -Filter fxc.exe -Recurse | Where-Object { $_.FullName -like '*\x64\fxc.exe' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "Windows SDK fxc.exe was not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-debug-x86_64
      - name: Build Qedit
        # GPUI's pinned Windows shader compiler is unavailable on hosted runners.
        # Debug assertions skip shader compilation while still producing a usable binary.
        run: cargo build --features mimalloc --package zed --package cli
      - name: Package Qedit
        shell: pwsh
        run: |
          $version = "${env:RELEASE_VERSION}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/debug/zed.exe package/Qedit.exe
          Copy-Item target/debug/cli.exe package/qedit-cli.exe
          Copy-Item LICENSE-GPL package/LICENSE-GPL
          Copy-Item icon.png package/Qedit.png
          Compress-Archive -Path package/* -DestinationPath "Qedit-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Qedit-${{ env.RELEASE_VERSION }}-windows-x86_64
          path: Qedit-*.zip

  publish:
    name: Publish GitHub release
    needs: [validate, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Qedit-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          tag="v$version"
          gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Qedit $version" --generate-notes
