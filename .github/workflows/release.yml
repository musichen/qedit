name: Release qedit

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Semver version already present in package.json, tauri.conf.json, and Cargo.toml
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PNPM_VERSION: 11.15.1
  # Set repository variable QEDIT_REQUIRE_SIGNING=1 only when all signing
  # secrets below are configured. The default is an explicitly unsigned
  # public preview; artifacts never claim to be signed without proof.
  QEDIT_REQUIRE_SIGNING: ${{ vars.QEDIT_REQUIRE_SIGNING || '0' }}
  CI: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-arm64
            runner: windows-11-arm
          - target: windows-x64
            runner: windows-2022
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare macOS signing identity before DMG creation
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          QEDIT_REQUIRE_SIGNING: ${{ env.QEDIT_REQUIRE_SIGNING }}
        run: bash scripts/release-sign-prepare.sh ${{ matrix.target }}
      - name: Build native bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm run release:build -- ${{ matrix.target }} ${{ steps.version.outputs.version }}
      - name: Sign and notarize release bundle
        if: startsWith(matrix.target, 'macos-') || startsWith(matrix.target, 'windows-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: pnpm run release:sign -- ${{ matrix.target }} ${{ steps.version.outputs.version }}
      - name: Mark Linux bundle unsigned by design
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: pnpm run release:sign -- ${{ matrix.target }} ${{ steps.version.outputs.version }}
      - name: Verify target bundle
        shell: bash
        env:
          QEDIT_REQUIRE_SIGNED: ${{ env.QEDIT_REQUIRE_SIGNING }}
        run: pnpm run release:verify -- ${{ matrix.target }} ${{ steps.version.outputs.version }} "dist/release/v${{ steps.version.outputs.version }}/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: qedit-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/release
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify matrix and publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: qedit-*
          merge-multiple: true
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify complete matrix and produce checksums/provenance
        shell: bash
        env:
          QEDIT_REQUIRE_SIGNED: ${{ env.QEDIT_REQUIRE_SIGNING }}
        run: |
          set -euo pipefail
          root="dist/release/v${{ steps.version.outputs.version }}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          bash scripts/release-verify.sh all "${{ steps.version.outputs.version }}" "$root"
      - name: Attest release subjects
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/v${{ steps.version.outputs.version }}/**/*.app.zip
            dist/release/v${{ steps.version.outputs.version }}/**/*.dmg
            dist/release/v${{ steps.version.outputs.version }}/**/*.msi
            dist/release/v${{ steps.version.outputs.version }}/**/*-nsis.exe
            dist/release/v${{ steps.version.outputs.version }}/**/*.deb
            dist/release/v${{ steps.version.outputs.version }}/**/*.AppImage
      - name: Create release branch and tag for manual dispatches
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          if ! git ls-remote --exit-code --refs origin "refs/tags/v$version" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/release/v$version"
            git tag -a "v$version" -m "Release v$version"
            git push origin "v$version"
          fi
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          last_tag=$(git describe --tags --abbrev=0 "v$version^" 2>/dev/null || true)
          if [[ -n "$last_tag" ]]; then changes=$(git log "$last_tag..HEAD" --pretty=format:'- %s (%an)'); else changes=$(git log --pretty=format:'- %s (%an)'); fi
          root="dist/release/v$version"
          {
            echo "# v$version"
            echo
            echo '## What''s New'
            echo "$changes"
            echo
            echo '## Verification'
            echo '- Six native runner targets built and verified.'
            echo '- SHA256SUMS and SLSA-style provenance attached.'
            echo
            echo '## Signing'
            if [[ "${QEDIT_REQUIRE_SIGNING}" == 1 ]]; then
              echo 'Signed publishing was required by repository variable QEDIT_REQUIRE_SIGNING=1.'
            else
              echo 'This is an unsigned public preview because QEDIT_REQUIRE_SIGNING is not enabled or signing secrets are absent.'
            fi
            echo
            echo '### Per-target status'
            node - "$root" <<'NODE'
const fs = require('node:fs');
const path = require('node:path');
const root = process.argv[2];
for (const target of ['macos-arm64', 'macos-x64', 'windows-arm64', 'windows-x64', 'linux-arm64', 'linux-x64']) {
  const manifest = JSON.parse(fs.readFileSync(path.join(root, target, 'manifest.json'), 'utf8'));
  console.log(`- ${target}: ${manifest.signing.status} — ${manifest.signing.reason}`);
}
NODE
          } > "$root/RELEASE_NOTES.md"
      - name: Prepare uniquely named release metadata
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          root="dist/release/v$version"
          metadata="$root/release-metadata"
          rm -rf "$metadata"
          mkdir -p "$metadata"
          for target in macos-arm64 macos-x64 windows-arm64 windows-x64 linux-arm64 linux-x64; do
            cp "$root/$target/manifest.json" "$metadata/qedit-v$version-$target-manifest.json"
            cp "$root/$target/signing.json" "$metadata/qedit-v$version-$target-signing.json"
          done
      - name: Publish with gh-axi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          root="dist/release/v$version"
          assets=("$root/SHA256SUMS" "$root/provenance.json")
          while IFS= read -r -d '' file; do assets+=("$file"); done < <(find "$root" -type f \( -name 'qedit-v*.app.zip' -o -name 'qedit-v*.dmg' -o -name 'qedit-v*.msi' -o -name 'qedit-v*.exe' -o -name 'qedit-v*.deb' -o -name 'qedit-v*.AppImage' -o -name 'qedit-v*-manifest.json' -o -name 'qedit-v*-signing.json' \) -print0 | sort -z)
          tag="v$version"
          repo="${GITHUB_REPOSITORY}"
          if npx -y gh-axi release view "$tag" >/dev/null 2>&1; then
            npx -y gh-axi release edit "$tag" --title "$tag" --notes-file "$root/RELEASE_NOTES.md"
            existing_assets_json=$(npx -y gh-axi api "repos/$repo/releases/tags/$tag" --jq '.assets' 2>/dev/null || echo '[]')
            for file in "${assets[@]}"; do
              name="$(basename "$file")"
              asset_id=$(echo "$existing_assets_json" | node -e "const a=JSON.parse(require('fs').readFileSync(0,'utf8'));const m=a.find(x=>x.name===process.argv[1]);if(m)console.log(m.id);" "$name")
              if [[ -n "$asset_id" ]]; then
                npx -y gh-axi api DELETE "repos/$repo/releases/assets/$asset_id" >/dev/null
              fi
            done
            npx -y gh-axi release upload "$tag" "${assets[@]}"
          else
            npx -y gh-axi release create "$tag" --verify-tag --title "$tag" --notes-file "$root/RELEASE_NOTES.md" "${assets[@]}"
          fi
