[package]
name = "qedit"
version = "0.1.0"
edition = "2021"
description = "A lightweight Tauri 2 desktop file editor with Monaco and integrated terminal"
authors = ["Alex Musichen <alex.musichen@gmail.com>"]
license = "MIT"
repository = "https://github.com/musichen/qedit"

[lib]
name = "qedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
portable-pty = "0.9"
libc = "0.2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
